services:
  postgres:
    image: postgres:16-alpine
    container_name: studyead_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyead
      POSTGRES_USER: studyead
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: studyead_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
