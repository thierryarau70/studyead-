services:
  postgres:
    image: postgres:16-alpine
    container_name: studyead_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyead
      POSTGRES_USER: studyead
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyead -d studyead"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyead_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: studyead_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://studyead:localdevpassword@postgres:5432/studyead?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-super-secret-key-change-in-production-min-32-chars-long
      JWT_EXPIRES_IN: 1d
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: studyead_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NUXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
